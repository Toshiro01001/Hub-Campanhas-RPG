<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Campanhas de RPG</title>
  <meta name="description" content="Menu principal das campanhas de RPG: escolha a campanha e entre.">
  <meta name="theme-color" content="#0b0b10">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261020b">
</head>
<body class="menu">
  <div class="fundo" aria-hidden="true"><div class="fundo-brilho"></div><div class="fundo-linhas"></div></div>

  <header class="topo">
    <div class="topo-marca">
      <img src="img/favicon.svg" alt="" width="34" height="34">
      <div>
        <p class="topo-kicker">Menu principal</p>
        <h1>Campanhas de RPG</h1>
      </div>
    </div>
    <button type="button" class="btn-som" id="btnSom" aria-pressed="false" title="Som do menu" aria-label="Som do menu">🔇<span class="som-txt"> Som</span></button>
  </header>

  <main class="palco">
    <section class="lista" aria-labelledby="tituloLista">
      <h2 id="tituloLista" class="lista-titulo">Selecione a campanha</h2>
      <nav class="grade" id="grade" aria-label="Campanhas"></nav>
      <p class="dica-teclas" aria-hidden="true"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> escolher · <kbd>Enter</kbd> entrar</p>
    </section>

    <aside class="detalhe" id="detalhe" aria-live="polite">
      <div class="detalhe-arte"><img id="dImg" src="" alt=""></div>
      <p class="detalhe-estado" id="dEstado"></p>
      <h2 class="detalhe-nome" id="dNome"></h2>
      <p class="detalhe-sub" id="dSub"></p>
      <ul class="detalhe-info" id="dInfo"></ul>
      <a class="detalhe-btn" id="dBtn" href="#"></a>
    </aside>
  </main>

  <footer class="rodape">
    <span id="contagem"></span>
  </footer>

  <script src="dados.js?v=20261020b"></script>
  <script src="app.js?v=20261020b"></script>
</body>
</html>
