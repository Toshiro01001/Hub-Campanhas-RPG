<svg xmlns="http://www.w3.org/2000/svg" viewBox="140 112 1000 1000" role="img" aria-label="Símbolo da Trindade: triângulo dourado feito de três triângulos">
  <defs>
    <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b4f1d"/>
      <stop offset=".22" stop-color="#b8923f"/>
      <stop offset=".42" stop-color="#f1d98f"/>
      <stop offset=".58" stop-color="#e2c172"/>
      <stop offset=".8" stop-color="#a98232"/>
      <stop offset="1" stop-color="#5e4418"/>
    </linearGradient>
    <linearGradient id="luz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d6" stop-opacity=".35"/>
      <stop offset=".55" stop-color="#fff6d6" stop-opacity="0"/>
      <stop offset="1" stop-color="#2a1d06" stop-opacity=".35"/>
    </linearGradient>
    <filter id="brilho" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="b"/>
      <feFlood flood-color="#e8c060" flood-opacity=".35"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- triângulo maior com os três vazados (losango central e dois triângulos), como no logo oficial -->
  <g filter="url(#brilho)">
    <path fill="url(#ouro)" fill-rule="evenodd" d="
      M640 195 L1112 1030 L168 1030 Z
      M640 408 L802 698 L640 1000 L478 698 Z
      M458 735 L575 955 L335 955 Z
      M822 735 L945 955 L705 955 Z"/>
    <path fill="url(#luz)" fill-rule="evenodd" d="
      M640 195 L1112 1030 L168 1030 Z
      M640 408 L802 698 L640 1000 L478 698 Z
      M458 735 L575 955 L335 955 Z
      M822 735 L945 955 L705 955 Z"/>
  </g>
</svg>
